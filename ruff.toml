extend-include = ["ibus-candidate-tidy", "ibus-health", "ime-probe", "kana-switch", "mozc-keymap"]
line-length = 120
target-version = "py310"

[format]
indent-style = "tab"
quote-style = "preserve"
skip-magic-trailing-comma = false

[lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "SIM", "UP", "ARG", "PLE", "PLW", "FURB", "RUF"]
